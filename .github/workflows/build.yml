name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.JellyNext.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyNext.sln --configuration Release --no-restore

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <AssemblyVersion> from Jellyfin.Plugin.JellyNext.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Extract target ABI
        id: targetabi
        run: |
          set -euo pipefail
          JELLYFIN_VERSION=$(grep -oPm1 '(?<=<PackageReference Include="Jellyfin.Controller" Version=")[^"]+' Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj)
          if [ -z "$JELLYFIN_VERSION" ]; then
            echo "::error::Could not read the Jellyfin.Controller package version"
            exit 1
          fi
          TARGET_ABI=$(echo "$JELLYFIN_VERSION" | sed 's/\.\*/.0/')
          # Drop any prerelease suffix, then pad to the four components Jellyfin compares as a Version.
          TARGET_ABI="${TARGET_ABI%%-*}"
          while [ "$(echo "$TARGET_ABI" | awk -F. '{print NF}')" -lt 4 ]; do
            TARGET_ABI="${TARGET_ABI}.0"
          done
          echo "targetabi=$TARGET_ABI" >> "$GITHUB_OUTPUT"
          echo "Target ABI: $TARGET_ABI"

      # A published version is immutable: re-releasing the same tag would swap the asset and
      # invalidate the checksum already advertised to users. Fail early instead.
      - name: Ensure the version is unreleased
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump <AssemblyVersion> and <FileVersion> in Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj, and add a matching '## v<version>' section to CHANGELOG.md, before releasing."
            exit 1
          fi
          echo "$TAG has not been released yet."

      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd Jellyfin.Plugin.JellyNext/bin/Release/net9.0
          zip -r "../../../../jellynext-v${VERSION}.zip" .

      - name: Calculate checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHECKSUM=$(md5sum "jellynext-v${VERSION}.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Checksum: $CHECKSUM"

      # Written to a file rather than a step output. Release notes are arbitrary Markdown, and
      # interpolating them into a shell command line would let backticks and $(...) execute.
      - name: Extract changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          sed -n "/^## v${VERSION_RE}\$/,/^## v/p" CHANGELOG.md | sed '1d; /^## v/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## v${VERSION}' section in CHANGELOG.md; using a generic release note."
            printf 'Release v%s\n' "$VERSION" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellynext-v${{ steps.version.outputs.version }}
          path: jellynext-v${{ steps.version.outputs.version }}.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jellynext ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: jellynext-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional. Set the PLUGIN_MANIFEST_REPO repository variable (owner/repo of your Jellyfin
      # plugin manifest repository) and a PAT_TOKEN secret with write access to it. The step
      # no-ops with a notice when either is missing, so forks release fine without it.
      - name: Trigger plugin repository update
        if: github.ref == 'refs/heads/main'
        env:
          MANIFEST_REPO: ${{ vars.PLUGIN_MANIFEST_REPO }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PLUGIN_GUID: a4df60c5-6ab4-412a-8f79-2cab93fb2bc5
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          TARGET_ABI: ${{ steps.targetabi.outputs.targetabi }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/jellynext-v${{ steps.version.outputs.version }}.zip
          CHANGELOG_FILE: release-notes.md
        run: .github/scripts/trigger-plugin-update.sh
