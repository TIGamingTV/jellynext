name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Jellyfin 10.11.x runs on .NET 9; Jellyfin 12.x runs on .NET 10. The plugin is multi-targeted
      # (see the .csproj) so both SDKs need to be present for `dotnet build` to produce both.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.JellyNext.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyNext.sln --configuration Release --no-restore

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <AssemblyVersion> from Jellyfin.Plugin.JellyNext.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

          # manifest.json requires a unique numeric version per entry (see update-manifest.sh), and
          # the net10.0/Jellyfin 12 build shares this project's single <AssemblyVersion>. Give it its
          # own manifest version by bumping the last component, which also keeps it sorting above the
          # net9.0 build for a Jellyfin 12 server that can see both entries - Jellyfin's own selection
          # logic filters by targetAbi and then just picks the highest version number, with no
          # awareness of targetAbi as a tiebreaker.
          VERSION_NET10=$(echo "$VERSION" | awk -F. '{print $1"."$2"."$3"."($4+1)}')
          echo "version_net10=$VERSION_NET10" >> "$GITHUB_OUTPUT"
          echo "Plugin version (net10.0/Jellyfin 12 build): $VERSION_NET10"

      # Drops any prerelease suffix, then pads to the four components Jellyfin compares as a Version.
      - name: Extract target ABIs
        id: targetabi
        run: |
          set -euo pipefail
          normalize_abi() {
            local abi
            abi=$(echo "$1" | sed 's/\.\*/.0/')
            abi="${abi%%-*}"
            while [ "$(echo "$abi" | awk -F. '{print NF}')" -lt 4 ]; do
              abi="${abi}.0"
            done
            echo "$abi"
          }

          JELLYFIN_VERSION_NET9=$(grep -oPm1 '(?<=<JellyfinPackageVersionNet9>)[^<]+' Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj)
          JELLYFIN_VERSION_NET10=$(grep -oPm1 '(?<=<JellyfinPackageVersionNet10>)[^<]+' Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj)
          if [ -z "$JELLYFIN_VERSION_NET9" ] || [ -z "$JELLYFIN_VERSION_NET10" ]; then
            echo "::error::Could not read JellyfinPackageVersionNet9/Net10 from Jellyfin.Plugin.JellyNext.csproj"
            exit 1
          fi

          TARGET_ABI_NET9=$(normalize_abi "$JELLYFIN_VERSION_NET9")
          TARGET_ABI_NET10=$(normalize_abi "$JELLYFIN_VERSION_NET10")
          echo "targetabi_net9=$TARGET_ABI_NET9" >> "$GITHUB_OUTPUT"
          echo "targetabi_net10=$TARGET_ABI_NET10" >> "$GITHUB_OUTPUT"
          echo "Target ABI (net9.0/10.11): $TARGET_ABI_NET9"
          echo "Target ABI (net10.0/12.x): $TARGET_ABI_NET10"

      # A published version is immutable: re-releasing the same tag would swap the asset and
      # invalidate the checksum already advertised to users. Fail early instead.
      - name: Ensure the version is unreleased
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump <AssemblyVersion> and <FileVersion> in Jellyfin.Plugin.JellyNext/Jellyfin.Plugin.JellyNext.csproj, and add a matching '## v<version>' section to CHANGELOG.md, before releasing."
            exit 1
          fi
          echo "$TAG has not been released yet."

      # Two zips, one per target framework / Jellyfin major line. The net9.0 asset keeps its
      # existing name so nothing about the 10.11 track's history or URLs changes.
      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd Jellyfin.Plugin.JellyNext/bin/Release/net9.0 && zip -r "../../../../jellynext-v${VERSION}.zip" .)
          (cd Jellyfin.Plugin.JellyNext/bin/Release/net10.0 && zip -r "../../../../jellynext-v${VERSION}-jf12.zip" .)

      - name: Calculate checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHECKSUM=$(md5sum "jellynext-v${VERSION}.zip" | awk '{print $1}')
          CHECKSUM_NET10=$(md5sum "jellynext-v${VERSION}-jf12.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "checksum_net10=$CHECKSUM_NET10" >> "$GITHUB_OUTPUT"
          echo "Checksum (net9.0/10.11): $CHECKSUM"
          echo "Checksum (net10.0/12.x): $CHECKSUM_NET10"

      # Written to a file rather than a step output. Release notes are arbitrary Markdown, and
      # interpolating them into a shell command line would let backticks and $(...) execute.
      - name: Extract changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          # Drop the heading, any trailing heading, and leading blank lines.
          sed -n "/^## v${VERSION_RE}\$/,/^## v/p" CHANGELOG.md \
            | sed '1d; /^## v/d' \
            | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## v${VERSION}' section in CHANGELOG.md; using a generic release note."
            printf 'Release v%s\n' "$VERSION" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellynext-v${{ steps.version.outputs.version }}
          path: |
            jellynext-v${{ steps.version.outputs.version }}.zip
            jellynext-v${{ steps.version.outputs.version }}-jf12.zip

      # One release, two assets - the 10.11 and 12.x builds are the same feature set, so they share
      # a tag and a changelog entry.
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jellynext ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            jellynext-v${{ steps.version.outputs.version }}.zip
            jellynext-v${{ steps.version.outputs.version }}-jf12.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This repository is its own Jellyfin plugin repository: manifest.json is served straight from
      # raw.githubusercontent.com. It can only be written after the release exists, because the
      # checksum has to match the asset that was actually published.
      #
      # Run twice, once per build: a Jellyfin server only ever sees entries whose targetAbi it meets,
      # so a 10.11 server gets the net9.0 build and a 12.x server gets the net10.0 build. Each needs
      # its own manifest `version` (see the version_net10 comment above) - update-manifest.sh upserts
      # by version, so these are two independent entries, not one being overwritten by the other.
      - name: Update plugin manifest (net9.0 / Jellyfin 10.11)
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_ABI: ${{ steps.targetabi.outputs.targetabi_net9 }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/jellynext-v${{ steps.version.outputs.version }}.zip
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          CHANGELOG_FILE: release-notes.md
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/update-manifest.sh

      - name: Update plugin manifest (net10.0 / Jellyfin 12)
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version_net10 }}
          TARGET_ABI: ${{ steps.targetabi.outputs.targetabi_net10 }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/jellynext-v${{ steps.version.outputs.version }}-jf12.zip
          CHECKSUM: ${{ steps.checksum.outputs.checksum_net10 }}
          CHANGELOG_FILE: release-notes.md
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/update-manifest.sh

      - name: Commit plugin manifest
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- manifest.json; then
            echo "manifest.json already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          # Commits authored by GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
          git commit -m "Publish v${VERSION} to the plugin manifest [skip ci]"
          git push origin HEAD:main
